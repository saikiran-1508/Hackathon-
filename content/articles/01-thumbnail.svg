<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>I Taught Hindsight to Remember Both Teams, Not Just One</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="55%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#151f38"/>
    </linearGradient>
    <radialGradient id="glowL" cx="14%" cy="30%" r="42%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="86%" cy="30%" r="42%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowL)"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>

  <!-- left cluster: "our team" memory bank (emerald) -->
  <g stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <line x1="150" y1="150" x2="230" y2="110"/>
    <line x1="230" y1="110" x2="300" y2="150"/>
    <line x1="230" y1="110" x2="220" y2="200"/>
    <line x1="150" y1="150" x2="220" y2="200"/>
    <line x1="220" y1="200" x2="300" y2="150"/>
  </g>
  <g fill="#34d399">
    <circle cx="150" cy="150" r="6"/>
    <circle cx="230" cy="110" r="7"/>
    <circle cx="300" cy="150" r="6"/>
    <circle cx="220" cy="200" r="6"/>
  </g>
  <text x="225" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#6ee7b7">OUR TEAM</text>

  <!-- right cluster: "opponent" memory bank (sky) -->
  <g stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <line x1="900" y1="150" x2="980" y2="110"/>
    <line x1="980" y1="110" x2="1050" y2="150"/>
    <line x1="980" y1="110" x2="970" y2="200"/>
    <line x1="900" y1="150" x2="970" y2="200"/>
    <line x1="970" y1="200" x2="1050" y2="150"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="900" cy="150" r="6"/>
    <circle cx="980" cy="110" r="7"/>
    <circle cx="1050" cy="150" r="6"/>
    <circle cx="970" cy="200" r="6"/>
  </g>
  <text x="975" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#7dd3fc">OPPONENT</text>

  <!-- converging lines from both clusters into a central reflection node -->
  <path d="M 230 210 Q 400 320 585 355" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 980 210 Q 810 320 625 355" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="600" cy="360" r="16" fill="#f8fafc"/>
  <circle cx="600" cy="360" r="30" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="600" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#f8fafc">ONE MATCHUP</text>

  <!-- title -->
  <text x="600" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#f8fafc">
    <tspan x="600" dy="0">I taught Hindsight to remember</tspan>
    <tspan x="600" dy="1.25em">both teams, not just one</tspan>
  </text>

  <!-- footer -->
  <rect x="490" y="580" width="60" height="4" rx="2" fill="#34d399"/>
  <text x="600" y="608" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">Built with Hindsight persistent memory</text>
</svg>
