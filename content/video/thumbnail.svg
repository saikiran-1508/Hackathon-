<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>My AI agent never forgets — built with Hindsight</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="55%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#131c33"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <rect width="1280" height="720" fill="url(#glow2)"/>

  <!-- faint connection-node motif, suggesting memory/network, right side -->
  <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <line x1="760" y1="180" x2="900" y2="120"/>
    <line x1="900" y1="120" x2="1060" y2="170"/>
    <line x1="900" y1="120" x2="940" y2="260"/>
    <line x1="940" y1="260" x2="1080" y2="300"/>
    <line x1="940" y1="260" x2="820" y2="330"/>
    <line x1="1060" y1="170" x2="1150" y2="260"/>
    <line x1="1080" y1="300" x2="1170" y2="380"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="760" cy="180" r="5"/>
    <circle cx="900" cy="120" r="6"/>
    <circle cx="1060" cy="170" r="5"/>
    <circle cx="940" cy="260" r="6"/>
    <circle cx="1080" cy="300" r="5"/>
    <circle cx="820" cy="330" r="4"/>
    <circle cx="1150" cy="260" r="4"/>
    <circle cx="1170" cy="380" r="4"/>
  </g>

  <!-- large crosshair / reticle motif, bottom right, echoing the app's own icon -->
  <g transform="translate(1010,520)" opacity="0.9">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.55"/>
    <circle cx="0" cy="0" r="86" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.75"/>
    <circle cx="0" cy="0" r="10" fill="#34d399"/>
    <line x1="0" y1="-190" x2="0" y2="-165" stroke="#38bdf8" stroke-width="3"/>
    <line x1="0" y1="190" x2="0" y2="165" stroke="#38bdf8" stroke-width="3"/>
    <line x1="-190" y1="0" x2="-165" y2="0" stroke="#38bdf8" stroke-width="3"/>
    <line x1="190" y1="0" x2="165" y2="0" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- eyebrow badge -->
  <rect x="80" y="120" width="290" height="46" rx="23" fill="#0f2e22" stroke="#34d399" stroke-width="1.5"/>
  <text x="225" y="149" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#6ee7b7">SCOUTING AGENT</text>

  <!-- title -->
  <text x="78" y="280" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" fill="#f8fafc">MY AI AGENT</text>
  <text x="78" y="380" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" fill="#38bdf8">NEVER FORGETS</text>

  <!-- subtitle -->
  <text x="80" y="450" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#94a3b8">Built with Hindsight persistent memory</text>

  <!-- bottom accent line -->
  <rect x="80" y="610" width="120" height="6" rx="3" fill="#34d399"/>
  <text x="80" y="660" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0">retain · recall · reflect</text>
</svg>
